name: Synapse
options:
  bundleIdPrefix: com.dzak
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

# DEVELOPMENT_TEAM: set for local device builds (Signing & Capabilities).
# Signing & Capabilities (both Synapse and SynapseWatch targets).
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: QYDB6YBZ34
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: "1.0.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk
    from: 3.2.2

targets:
  Synapse:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # GoogleService-Info.plist is local-only (gitignored). Download from Firebase
    # Console (synapse-clinical-hz) or copy the .example stub so the file exists.
    sources:
      - path: Sources/iOS
        excludes:
          - GoogleService-Info.plist
          - GoogleService-Info.plist.example
          - Voice/VoiceSecrets.plist
          - Voice/VoiceSecrets.plist.example
          - Pet/Resources/**
      - path: Sources/iOS/GoogleService-Info.plist
        optional: true
        buildPhase: resources
      # VoiceSecrets.plist is local-only (gitignored). Copy VoiceSecrets.plist.example
      # or create via plutil so Bundle.main can load keys (after env / Info.plist).
      - path: Sources/iOS/Voice/VoiceSecrets.plist
        optional: true
        buildPhase: resources
      # Clawd pet atlas + animation contract (see clawd-pet-package/TUTORIAL.md).
      - path: Sources/iOS/Pet/Resources
        buildPhase: resources
      - path: Sources/Shared
    dependencies:
      - target: SynapseWatch
        embed: true
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
      - package: ElevenLabs
        product: ElevenLabs
      - sdk: HealthKit.framework
      - sdk: Charts.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dzak.synapse
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sources/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/iOS/Synapse.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        # DEVELOPMENT_TEAM: set in Xcode Signing & Capabilities
    scheme:
      testTargets:
        - SynapseTests
      # Debug-only arousal channel measurement (§12). Off in Release. Unset for a clean demo console.
      environmentVariables:
        SYNAPSE_AROUSAL_DIAG: "1"

  SynapseWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/watchOS
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dzak.synapse.watchkitapp
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        INFOPLIST_FILE: Sources/watchOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/watchOS/SynapseWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SDKROOT: watchos
        # DEVELOPMENT_TEAM: set in Xcode Signing & Capabilities
    scheme:
      testTargets: []

  SynapseTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/SynapseTests
    dependencies:
      - target: Synapse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dzak.synapse.tests
        GENERATE_INFOPLIST_FILE: YES
        # Hosted tests so @testable import Synapse resolves KineticClockEngine.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Synapse.app/Synapse"
        BUNDLE_LOADER: "$(TEST_HOST)"
